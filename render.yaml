# Render blueprint for the RecoveryAI FastAPI backend.
# The React frontend is deployed to GitHub Pages by .github/workflows/deploy-pages.yml.
services:
  - type: web
    name: recovery-ai-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite:////data/recovery_ai.db
      - key: SECRET_KEY
        generateValue: true
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ALLOW_UNSIGNED_WEBHOOKS
        value: "false"
      - key: LLM_PROVIDER
        value: mock
      - key: CORS_ORIGINS
        value: https://pankaj425.github.io,http://localhost:5173
      - key: SEED_ON_STARTUP
        value: "true"
      - key: SEED_CUSTOMERS
        value: "5000"
      - key: SEED_TRANSACTIONS
        value: "20000"
